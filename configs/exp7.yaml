experiment_name: exp7_low_resource_hybrid

seed: 42
output_dir: outputs/exp7

datasets:
  - imdb
  - sst2

model_name: bert-base-uncased
max_length: 128

training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 20
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_accuracy
  greater_is_better: true

methods:
  - hybrid

hybrid:
  prefix_virtual_tokens: 20
  prompt_virtual_tokens: 20
  unfreeze_last_n_layers: 0

low_resource_percentages:
  - 0.10
  - 0.25
  - 0.50

eval_size: 500

debug_mode: false

debug:
  low_resource_settings:
    - 100
    - 250
  eval_size: 100
  num_train_epochs: 1