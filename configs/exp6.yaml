experiment_name: exp6_cross_domain_adaptation

seed: 42
output_dir: outputs/exp6

model_name: bert-base-uncased
max_length: 128

source_datasets:
  - imdb

target_datasets:
  - yelp_polarity
  - amazon_polarity

training:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 20
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_accuracy
  greater_is_better: true

method: hybrid

hybrid:
  prefix_virtual_tokens: 20
  prompt_virtual_tokens: 20
  unfreeze_last_n_layers: 0

debug:
  train_size: 500
  source_eval_size: 200
  target_eval_size: 300