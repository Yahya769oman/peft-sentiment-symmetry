experiment_name: exp5_comparative_peft_methods

seed: 42
output_dir: outputs/exp5

dataset: sst2

model_name: bert-base-uncased
max_length: 128

training:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 20
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_accuracy
  greater_is_better: true

methods:
  - full
  - prefix
  - prompt
  - hybrid
  - lora
  - bitfit

prefix:
  num_virtual_tokens: 10

prompt:
  num_virtual_tokens: 5

hybrid:
  prefix_virtual_tokens: 10
  prompt_virtual_tokens: 5

lora:
  r: 8
  alpha: 16
  dropout: 0.1

debug:
  train_size: 500
  eval_size: 200