experiment_name: exp4_parameter_sensitivity_analysis

seed: 42
output_dir: outputs/exp4

datasets:
  - sst2
  - imdb

model_name: bert-base-uncased
max_length: 128

training:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 20
  evaluation_strategy: epoch

  # مهم:
  # EXP4 هدفها تسجيل النتائج فقط، وليس حفظ أفضل موديل.
  # هذا يمنع خطأ shared tensors وقت حفظ checkpoint.
  save_strategy: "no"
  load_best_model_at_end: false

  metric_for_best_model: eval_accuracy
  greater_is_better: true

methods:
  - hybrid

prefix:
  num_virtual_tokens: 20

prompt:
  num_virtual_tokens: 20

hybrid:
  prefix_virtual_tokens: 20
  prompt_virtual_tokens: 20
  unfreeze_last_n_layers: 0

debug:
  train_size: 500
  eval_size: 200

sensitivity:
  prefix_virtual_tokens:
    - 5
    - 10
    - 20

  prompt_virtual_tokens:
    - 5
    - 10
    - 20

  learning_rate:
    - 0.0001
    - 0.0003
    - 0.0005