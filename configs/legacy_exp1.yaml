experiment_name: exp1_full_vs_hybrid_fair_fast

seed: 42
output_dir: outputs/exp1_full_vs_hybrid_fair_fast

datasets:
  - sst2
  - imdb

model_name: bert-base-uncased
max_length: 128

fast_mode:
  enabled: true
  train_size: 1000
  eval_size: 300

training:
  num_train_epochs: 2
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 25
  evaluation_strategy: epoch
  save_strategy: "no"
  load_best_model_at_end: false
  metric_for_best_model: eval_accuracy
  greater_is_better: true

methods:
  - full
  - hybrid

prefix:
  num_virtual_tokens: 20

prompt:
  num_virtual_tokens: 20

hybrid:
  prefix_virtual_tokens: 20
  prompt_virtual_tokens: 20
  unfreeze_last_n_layers: 1

method_overrides:
  hybrid:
    learning_rate: 3.0e-4
    num_train_epochs: 5