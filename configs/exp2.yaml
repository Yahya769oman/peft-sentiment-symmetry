experiment_name: exp2_prefix_prompt_hybrid_ablation

seed: 42
output_dir: outputs/exp2

datasets:
  - sst2
  - imdb

model_name: bert-base-uncased
max_length: 128

subset:
  train_size: 1500
  eval_size: 300

training:
  num_train_epochs: 2
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 25
  evaluation_strategy: epoch
  save_strategy: "no"
  load_best_model_at_end: false
  metric_for_best_model: eval_accuracy
  greater_is_better: true

methods:
  - prefix
  - prompt
  - hybrid

prefix:
  num_virtual_tokens: 20

prompt:
  num_virtual_tokens: 20

hybrid:
  prefix_virtual_tokens: 20
  prompt_virtual_tokens: 20
  unfreeze_last_n_layers: 0

analysis:
  attention_examples: 20